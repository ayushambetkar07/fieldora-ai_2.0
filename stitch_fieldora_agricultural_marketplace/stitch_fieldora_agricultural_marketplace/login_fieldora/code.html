<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Fieldora Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#4ae176",
                        "tertiary-container": "#004dcd",
                        "primary": "#004c22",
                        "on-tertiary-fixed-variant": "#003ea8",
                        "surface-tint": "#1f6c3a",
                        "inverse-primary": "#8bd79b",
                        "secondary-fixed": "#6bff8f",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#bfcdff",
                        "surface-container-highest": "#dae5dc",
                        "secondary-container": "#6bff8f",
                        "on-secondary-fixed": "#002109",
                        "surface-container-low": "#ebf7ed",
                        "primary-fixed": "#a6f4b5",
                        "on-surface": "#141e18",
                        "surface-bright": "#f1fcf2",
                        "on-background": "#141e18",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#dbe1ff",
                        "on-secondary-container": "#007432",
                        "on-primary-fixed": "#00210b",
                        "secondary": "#006e2f",
                        "inverse-surface": "#28332c",
                        "primary-fixed-dim": "#8bd79b",
                        "tertiary-fixed-dim": "#b4c5ff",
                        "surface-container": "#e5f1e7",
                        "surface-dim": "#d1ddd3",
                        "background": "#f1fcf2",
                        "surface": "#f1fcf2",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "outline-variant": "#bfc9bd",
                        "outline": "#707a6f",
                        "primary-container": "#166534",
                        "on-primary-fixed-variant": "#005226",
                        "surface-container-high": "#e0ebe1",
                        "on-primary-container": "#93e0a2",
                        "inverse-on-surface": "#e8f4ea",
                        "tertiary": "#00389b",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#005321",
                        "surface-variant": "#dae5dc",
                        "on-tertiary-fixed": "#00174b",
                        "on-surface-variant": "#404940"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "base": "4px",
                        "md": "16px",
                        "xs": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "section-title": ["Inter"],
                        "impact-price": ["Inter"],
                        "body-secondary": ["Inter"],
                        "page-title-mobile": ["Inter"],
                        "page-title": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-main": ["Inter"]
                    },
                    "fontSize": {
                        "section-title": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "impact-price": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "body-secondary": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "page-title-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "page-title": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-main": ["15px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #F7F9F6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-main text-on-surface">
<main class="w-full max-w-md">
<div class="flex justify-center mb-xl">
<img alt="Fieldora Logo" class="h-16 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-ZV7XxjIGfDGD01FGbm9l87yAON7ER6FCAGcrCLIM0-sgs5dOVjGpPNw916s0q6hkA1SsAGFft22HWY12evLIgqiCpoOl6QIxwCvlw5r9Iu8mxsOqvTBI6kFvXqQrPn8mFSXnuXQcp6VxVBAceG6tPIMmmWeo3SEEi5MpDtEdotCgkQIzSkt8Q0eWDshZ_xB6H2M0ee35j8fYYmEUhbn75eWS9Ue5lYIBx-NHTgTmoVexUA7j8dgvOA">
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg md:p-xl shadow-[0px_4px_12px_rgba(23,33,27,0.05)]">
<div class="text-center mb-lg">
<h1 class="font-page-title text-page-title text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-secondary text-body-secondary text-on-surface-variant">Sign in to your account</p>
</div>
<!-- Role Toggle -->
<div class="flex bg-surface-container-highest p-1 rounded-lg mb-lg">
<button class="flex-1 py-2 text-center rounded-md bg-surface-container-lowest text-primary font-section-title text-body-secondary shadow-sm transition-colors" id="role-farmer">
                    Farmer
                </button>
<button class="flex-1 py-2 text-center rounded-md text-on-surface-variant hover:text-on-surface font-section-title text-body-secondary transition-colors" id="role-buyer">
                    Buyer
                </button>
</div>
<form action="#" class="space-y-md" method="POST">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-3 py-2 text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-secondary text-[12px] text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-3 py-2 text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary h-11 md:h-12 rounded-lg font-section-title text-body-secondary flex items-center justify-center hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                        Login
                    </button>
</div>
</form>
<div class="mt-lg text-center font-body-secondary text-body-secondary text-on-surface-variant">
                Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign up</a>
</div>
</div>
</main>
<script>
        const btnFarmer = document.getElementById('role-farmer');
        const btnBuyer = document.getElementById('role-buyer');

        btnFarmer.addEventListener('click', (e) => {
            e.preventDefault();
            btnFarmer.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
            btnFarmer.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
            
            btnBuyer.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
            btnBuyer.classList.add('text-on-surface-variant', 'hover:text-on-surface');
        });

        btnBuyer.addEventListener('click', (e) => {
            e.preventDefault();
            btnBuyer.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
            btnBuyer.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
            
            btnFarmer.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
            btnFarmer.classList.add('text-on-surface-variant', 'hover:text-on-surface');
        });
    </script>
</body></html>
