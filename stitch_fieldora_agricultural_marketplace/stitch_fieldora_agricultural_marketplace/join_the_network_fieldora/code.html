<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Fieldora - Select Your Role</title>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(11, 43, 22, 0.08);
        }
        
        .ambient-bg {
            background: radial-gradient(circle at top left, rgba(166, 244, 181, 0.4) 0%, transparent 40%),
                        radial-gradient(circle at bottom right, rgba(218, 229, 220, 0.8) 0%, transparent 50%),
                        linear-gradient(135deg, #f8faf9 0%, #e1e3e2 100%);
        }
        
        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px 0 rgba(11, 43, 22, 0.12);
        }
        
        .icon-bloom {
            filter: drop-shadow(0 4px 12px rgba(0, 76, 34, 0.2));
        }
    </style>
</head>
<body class="ambient-bg min-h-screen flex flex-col font-sans text-on-surface antialiased overflow-hidden">
<!-- TopNav Suppressed - Linear/Transactional Gateway -->
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop relative z-10">
<!-- Header Section -->
<div class="text-center mb-12 max-w-2xl mx-auto space-y-4">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Fieldora</h1>
<p class="font-headline-md text-headline-md text-on-surface-variant font-light">Sophisticated Stewardship</p>
<div class="w-16 h-1 bg-primary/20 mx-auto rounded-full mt-6"></div>
<h2 class="font-title-md text-title-md text-on-surface mt-8">Select your operational pathway</h2>
</div>
<!-- Role Selection Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl mx-auto">
<!-- Farmer / FPO Card -->
<button class="glass-panel hover-lift rounded-[24px] p-8 md:p-12 flex flex-col items-center text-center group relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-4 focus:ring-offset-surface">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="w-24 h-24 rounded-full bg-soft-sage/30 flex items-center justify-center mb-8 icon-bloom transition-transform duration-500 group-hover:scale-110">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="agriculture" style="font-variation-settings: 'FILL' 0, 'wght' 200;">agriculture</span>
</div>
<h3 class="font-headline-lg text-headline-lg text-primary mb-4">Farmer / FPO</h3>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                    Manage yields, access market intelligence, and connect directly with premium buyers.
                </p>
<div class="mt-8 flex items-center gap-2 text-primary font-title-md text-title-md opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-400">
<span>Enter Portal</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Buyer Card -->
<button class="glass-panel hover-lift rounded-[24px] p-8 md:p-12 flex flex-col items-center text-center group relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-4 focus:ring-offset-surface">
<div class="absolute inset-0 bg-gradient-to-bl from-secondary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="w-24 h-24 rounded-full bg-soft-sage/30 flex items-center justify-center mb-8 icon-bloom transition-transform duration-500 group-hover:scale-110">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="storefront" style="font-variation-settings: 'FILL' 0, 'wght' 200;">storefront</span>
</div>
<h3 class="font-headline-lg text-headline-lg text-primary mb-4">Buyer</h3>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                    Source premium produce, track fulfillment, and secure verified agricultural assets.
                </p>
<div class="mt-8 flex items-center gap-2 text-primary font-title-md text-title-md opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-400">
<span>Enter Portal</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
</div>
<!-- Minimal Footer for context -->
<div class="mt-auto pt-12">
<p class="font-label-sm text-label-sm text-outline tracking-wider uppercase">Secure Agricultural Infrastructure</p>
</div>
</main>
<!-- SideNav Suppressed - Linear/Transactional Gateway -->
</body></html>
